name: Deploy to ingress VM

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-knowledge-library-mcp]

jobs:
  deploy:
    runs-on: [self-hosted, mac-mini]
    steps:
      - name: Wait for OrbStack
        # Any `orb` command starts OrbStack. Only the Mini's LaunchAgent
        # com.kenne.orbstack-start may start it, after the encrypted
        # /Volumes/orbstore unlocks. Wait for it; never start it from here.
        # See personal-portal docs/system-architecture/external-disk.md.
        run: |
          for _ in $(seq 1 72); do
            pgrep -xq OrbStack && exit 0
            sleep 5
          done
          echo "::error::OrbStack not running after 6 min. Not starting it: /Volumes/orbstore may be missing. See ~/Library/Logs/orbstack-start.log on the Mini."
          exit 1

      - name: Install on ingress VM
        # The install script in the Mini's personal-portal checkout is the one
        # way to deploy this server, by hand or from CI. It installs Python
        # dependencies as the service account, pinned by uv.lock. See
        # personal-portal docs/system-architecture/ingress-vm-architecture.md.
        run: |
          orb run -m ingress -u root bash -s -- install \
            < "$HOME/code/personal-portal/deploy/ingress-vm/knowledge-library-mcp.sh"
