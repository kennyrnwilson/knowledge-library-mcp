[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "knowledge-library-mcp"
version = "0.1.0"
description = "MCP server exposing the knowledge-library to Claude clients (read + write + git)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kenny" }]
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
knowledge-library-mcp = "knowledge_library_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_library_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
